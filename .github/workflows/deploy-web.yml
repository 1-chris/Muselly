name: Deploy web demo to GitHub Pages

# Builds the WebAssembly head (Muselly.Web) and publishes it to GitHub Pages. No server is involved —
# Pages just serves the static AppBundle.
#
# IMPORTANT: this requires the repo's Pages source to be set to "GitHub Actions" (Settings -> Pages).
#
# The app uses <base href="./">, so it works from a sub-path and needs NO cross-origin isolation
# (no COOP/COEP headers, which Pages can't set).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deployment at a time; don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Publish Muselly.Web (Release)
        run: dotnet publish Muselly.Web/Muselly.Web.csproj -c Release

      - name: Assemble Pages site
        run: |
          set -e
          BUNDLE="Muselly.Web/bin/Release/net10.0-browser/browser-wasm/AppBundle"
          rm -rf _site
          mkdir -p _site
          cp -r "$BUNDLE/." _site/
          # .nojekyll so Pages serves _framework/ (leading underscore) and skips the Jekyll build.
          touch _site/.nojekyll
          echo "Assembled site:"; find _site -maxdepth 1 -mindepth 1 | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
